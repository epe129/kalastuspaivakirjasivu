<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poista tietoja</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #2c2c2c;
            color: #222;
        }

        .main-content {
            display: grid;
            grid-template-columns: 33% 33%;
            margin: 60px auto;
            justify-content: center;
            align-items: center;
        }

        .main-content div {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin: 10px;   
            overflow: hidden;
            background-color: #3d3d3d;
        }
         .main-content form {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .main-content label {
            font-weight: 600;
            color: white;
            font-size: 14px;
        }

        .main-content select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background-color: white;
            cursor: pointer;
            transition: border-color 0.2s;
        }

        .main-content select:hover {
            border-color: #999;
        }

        .main-content select:focus {
            outline: none;
            border-color: #0066cc;
            box-shadow: 0 0 4px rgba(0, 102, 204, 0.3);
        }

        .main-content button {
            padding: 10px 16px;
            background-color: #d9534f;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .main-content button:hover {
            background-color: #c9302c;
        }

        .main-content button:active {
            background-color: #ac2925;
        }
    </style>
</head>
<body>
    {% extends 'navbar.html' %}
    {% block body %}
    <div class="main-content">
        <div>
            <form method="POST" action="{{ url_for('delete_user') }}">
                <label for="users">Poista käyttäjä</label>
                <select name="users" id="users">
                    {% for user in users %}
                    <option value="{{ user[0] }}">{{ user[1] }}</option>
                    {% endfor %}
                </select>                
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Poista</button>
            </form>
        </div>

        <div>
            <form method="POST" action="{{ url_for('delete_laji') }}">
                <label for="laji">Poista laji</label>
                <select name="laji" id="laji">
                    {% for item in laji %}
                    <option value="{{ item[0] }}">{{ item[1] }}</option>
                    {% endfor %}
                </select>   
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Poista</button>
            </form>
        </div>
        
        <div>
            <form method="POST" action="{{ url_for('delete_vapa') }}">
                <label for="vapa">Poista vapa</label>
                <select name="vapa" id="vapa">
                    {% for item in vapa %}
                    <option value="{{ item[0] }}">{{ item[1] }}</option>
                    {% endfor %}
                </select>   
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Poista</button>
            </form>
        </div>
        
        <div>
            <form method="POST" action="{{ url_for('delete_viehe') }}">
                <label for="viehe">Poista viehe</label>
                <select name="viehe" id="viehe">
                    {% for item in viehe %}
                    <option value="{{ item[0] }}">{{ item[1] }}</option>
                    {% endfor %}
                </select>   
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button type="submit">Poista</button>
            </form>
        </div>
    </div>
    {% endblock %}
</body>
</html>
